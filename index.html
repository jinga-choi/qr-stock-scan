<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { margin: 0; font-family: -apple-system, 'Malgun Gothic', sans-serif; background: #f4f5f7; color: #222; }
    header { background: #1f4e79; color: #fff; padding: 12px 16px; font-size: 18px; font-weight: bold; }
    main { padding: 12px 16px; max-width: 480px; margin: 0 auto; }
    #reader { width: 100%; background: #000; border-radius: 8px; overflow: hidden; }
    button { width: 100%; padding: 14px; font-size: 17px; border: 0; border-radius: 8px; margin-top: 8px; }
    .primary { background: #1f4e79; color: #fff; }
    .secondary { background: #e1e5ea; color: #222; }
    button:disabled { opacity: .6; }
    .manual { display: flex; gap: 8px; margin-top: 8px; }
    .manual input { flex: 1; min-width: 0; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
    .manual button { width: auto; margin: 0; padding: 12px 16px; }
    #result { margin-top: 12px; padding: 16px; border-radius: 8px; font-size: 18px; font-weight: bold; text-align: center; background: #fff; word-break: break-all; }
    #result.matched { background: #d4edda; color: #155724; }
    #result.added { background: #fff3cd; color: #856404; }
    #result.error { background: #f8d7da; color: #721c24; }
    #result.pending { background: #e2e3e5; color: #333; }
    #stats { margin-top: 12px; font-size: 14px; color: #555; }
    ul { list-style: none; padding: 0; margin: 8px 0 0; }
    li { background: #fff; margin-bottom: 4px; padding: 8px 10px; border-radius: 6px; font-size: 14px; word-break: break-all; }
    li.matched { border-left: 5px solid #28a745; }
    li.added { border-left: 5px solid #ffc107; }
    li.error { border-left: 5px solid #dc3545; }
  </style>
</head>
<body>
  <header>완성기대 실물조사</header>
  <main>
    <div id="reader"></div>
    <button id="startBtn" class="primary">📷 스캔 시작</button>
    <button id="photoBtn" class="secondary">🖼 사진 찍어서 인식 (카메라가 안 켜질 때)</button>
    <input id="photoInput" type="file" accept="image/*" capture="environment" hidden>
    <div id="fileReader" hidden></div>
    <div class="manual">
      <input id="manualInput" placeholder="번호 직접 입력" autocapitalize="characters" autocomplete="off">
      <button id="manualBtn" class="secondary">입력</button>
    </div>
    <div id="result">스캔 시작을 눌러주세요</div>
    <div id="stats">이번 접속 저장: 0건</div>
    <ul id="history"></ul>
  </main>

  <script>
    const DUPLICATE_WINDOW_MS = 3000;  // 같은 QR이 카메라에 계속 잡혀도 3초 안에는 한 번만 전송
    const HISTORY_LIMIT = 20;

    // Apps Script 안에서 열리면 google.script.run, GitHub Pages에서 열리면 웹앱 주소로 fetch
    const IN_APPS_SCRIPT = typeof google !== 'undefined' && google.script && google.script.run;
    const API_URL = IN_APPS_SCRIPT ? '' : loadApiUrl();

    const camera = new Html5Qrcode('reader');
    const fileScanner = new Html5Qrcode('fileReader');
    const el = id => document.getElementById(id);
    let lastCode = '';
    let lastTime = 0;
    let savedCount = 0;
    let audioCtx = null;

    el('startBtn').addEventListener('click', startCamera);
    el('photoBtn').addEventListener('click', () => { initAudio(); el('photoInput').click(); });
    el('photoInput').addEventListener('change', scanPhoto);
    el('manualBtn').addEventListener('click', submitManual);
    el('manualInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitManual(); });

    function startCamera() {
      initAudio();
      el('startBtn').disabled = true;
      camera.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onDecoded,
        () => {}
      ).then(() => {
        el('startBtn').textContent = '스캔 중... QR을 비춰주세요';
        showResult('pending', 'QR을 비춰주세요');
      }).catch(err => {
        el('startBtn').disabled = false;
        showResult('error', '카메라를 켤 수 없습니다. "사진 찍어서 인식"을 사용하세요. (' + err + ')');
      });
    }

    function scanPhoto(e) {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      fileScanner.scanFile(file, false)
        .then(text => submit(text))
        .catch(() => showResult('error', 'QR을 찾지 못했습니다. QR이 크게 나오도록 다시 찍어주세요.'));
    }

    function submitManual() {
      const text = el('manualInput').value;
      el('manualInput').value = '';
      submit(text);
    }

    function onDecoded(text) {
      const now = Date.now();
      if (text === lastCode && now - lastTime < DUPLICATE_WINDOW_MS) return;
      lastCode = text;
      lastTime = now;
      submit(text);
    }

    function submit(text) {
      const code = String(text || '').trim();
      if (!code) return;
      showResult('pending', code + ' 저장 중...');
      callApi(code)
        .then(handleResult)
        .catch(err => handleResult({ status: 'error', code, message: '❌ 서버 연결 실패: ' + err.message }));
    }

    function callApi(code) {
      if (IN_APPS_SCRIPT) {
        return new Promise((resolve, reject) =>
          google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).recordScan(code));
      }
      if (!API_URL) return Promise.reject(new Error('웹앱 주소가 없습니다. 안내받은 링크로 다시 접속하세요.'));
      // text/plain 본문이라 CORS 사전요청 없이 Apps Script doPost로 전달됨
      return fetch(API_URL, { method: 'POST', body: JSON.stringify({ code }) }).then(r => r.json());
    }

    // 웹앱 주소는 링크의 #api=... 로 전달 → 이 휴대폰에 저장 (공개 저장소에 주소를 남기지 않기 위함)
    function loadApiUrl() {
      const m = location.hash.match(/api=([^&]+)/);
      const fromHash = m ? decodeURIComponent(m[1]) : '';
      try {
        if (fromHash) localStorage.setItem('apiUrl', fromHash);
        return fromHash || localStorage.getItem('apiUrl') || '';
      } catch (e) {
        return fromHash;
      }
    }

    function handleResult(res) {
      showResult(res.status, res.message);
      feedback(res.status);
      if (res.status !== 'error') {
        savedCount++;
        el('stats').textContent = '이번 접속 저장: ' + savedCount + '건';
      }
      addHistory(res);
    }

    function showResult(status, message) {
      el('result').className = status;
      el('result').textContent = message;
    }

    function addHistory(res) {
      const li = document.createElement('li');
      li.className = res.status;
      li.textContent = new Date().toLocaleTimeString('ko-KR') + '  ' + res.message;
      const list = el('history');
      list.insertBefore(li, list.firstChild);
      while (list.children.length > HISTORY_LIMIT) list.removeChild(list.lastChild);
    }

    function initAudio() {
      try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }

    function beep(freq, ms) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.value = 0.2;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + ms / 1000);
      } catch (e) {}
    }

    function feedback(status) {
      const vibrate = pattern => { if (navigator.vibrate) navigator.vibrate(pattern); };
      if (status === 'matched') { beep(1200, 120); vibrate(100); }
      else if (status === 'added') { beep(800, 150); setTimeout(() => beep(800, 150), 200); vibrate([100, 80, 100]); }
      else { beep(300, 400); vibrate(400); }
    }
  </script>
</body>
</html>
